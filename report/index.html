<!doctype html>
<html lang="ru">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>IndieRadar Report</title>
  <script>
    (function () {
      var params = new URLSearchParams(window.location.search);
      var q = params.get("q");

      if (!q) {
        window.location.replace("/");
        return;
      }

      var target = "/report/" + q.replace(/^\/+|\/+$/g, "");

      if (!target.endsWith("/")) {
        target += "/";
      }

      window.location.replace(target + window.location.hash);
    })();
  </script>
</head>
<body></body>
</html>
